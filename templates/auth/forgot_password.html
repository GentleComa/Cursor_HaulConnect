{% extends "base.html" %}

{% block title %}Forgot Password - HaulConnect{% endblock %}

{% block content %}
<div class="auth-container" style="max-width: 420px; margin: var(--space-2xl) auto;">
    <div class="card">
        <h1 style="margin-bottom: var(--space-md);">Reset Password</h1>
        <p class="text-muted" style="margin-bottom: var(--space-xl);">
            Enter your email address and we'll send you a link to reset your password.
        </p>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div style="margin-bottom: var(--space-md);">
                <label style="display: block; margin-bottom: var(--space-xs); font-weight: 500;">Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com" 
                       style="width: 100%; padding: var(--space-sm) var(--space-md); background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text);">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                Send Reset Link
            </button>
        </form>
        
        <p style="text-align: center; margin-top: var(--space-lg); color: var(--color-text-muted);">
            <a href="{{ url_for('auth.login') }}" style="color: var(--color-primary);">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
